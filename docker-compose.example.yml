services:
  wb-proxy:
    build: .
    image: ardeyouxipianyi/workbuddy2api-hub:latest
    container_name: wb-proxy
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # 在此填写你的网关 API Key；本地自定义 docker-compose.yml 已通过 .gitignore 忽略，不会上传仓库
      - API_KEY=your_api_key_here
      - TZ=Asia/Shanghai
    volumes:
      # 持久化挂载账号凭证与用量流水
      - ./accounts:/app/accounts
      - ./usage:/app/usage
