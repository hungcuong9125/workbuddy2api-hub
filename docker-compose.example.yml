services:
  wb-proxy:
    build: .
    image: ardeyouxipianyi/workbuddy2api-hub:latest
    container_name: wb-proxy
    restart: unless-stopped
    ports:
      # 左侧宿主端口可自选；右侧是容器内监听端口，必须与下面的 PORT 一致
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # Điền API key của gateway vào đây; để trống (comment lại dòng dưới) thì container sẽ
      # tự sinh API key lúc khởi động (ghi vào ./accounts/settings.json và in trong log khởi động).
      - API_KEY=your_api_key_here
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      # 持久化挂载账号凭证与用量流水
      - ./accounts:/app/accounts
      - ./usage:/app/usage
